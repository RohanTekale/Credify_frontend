version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: credify_frontend_app
    expose:
      - "5173"
    environment:
      - VITE_API_URL=/api   
    restart: always
    networks:
      - credify-net

  nginx:
    image: nginx:latest
    ports:
      - "3001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    restart: always
    networks:
      - credify-net

networks:
  credify-net:
    external: true